name: Futu
description: >-
  Futu Holdings Limited (NASDAQ: FUTU), operator of the Futubull and moomoo
  platforms, is a digital brokerage and wealth-management technology company. Its
  Futu OpenAPI gives developers programmatic access to real-time and historical
  market data and to trading across Hong Kong, US, China A-share, Singapore,
  Malaysia and Japan markets, plus options, futures, cryptocurrency and event
  (prediction) contracts. Rather than an HTTP/REST API, Futu exposes a proprietary
  Protocol Buffers (proto2) protocol over TCP through a locally run OpenD gateway,
  with official Python, Java, C#, C++ and JavaScript SDKs and an official
  MCP-compatible Agent Skill hub. Backed by Hongshan and Ribbit Capital.
