description: >-
  Futu OpenAPI is a proprietary binary protocol (Protocol Buffers, proto2)
  spoken over TCP to the local OpenD gateway, not an HTTP/REST API. The complete
  wire protocol is published as .proto definitions in the official Python SDK
  repository (FutunnOpen/py-futu-api). Each request/response pair is a proto
  message family (C2S / S2C) keyed by a numeric protoID. Files are grouped into
  Basic (connection/session), Qot_* (quotation / market data) and Trd_* (trading)
  services. The eight core files below are saved verbatim; the full set of 77 is
  indexed by name.
syntax: proto2
transport: tcp-to-opend-gateway
services:
  - name: basic
    description: Connection, session, keep-alive, quota and user info.
    files: [Common.proto, InitConnect.proto, KeepAlive.proto, GetGlobalState.proto, GetUserInfo.proto, GetDelayStatistics.proto, Notify.proto, UsedQuota.proto, Verification.proto, TestCmd.proto]
  - name: quotation
    description: Market data — snapshots, K-line, order book, ticks, subscriptions, plates, options, IPO, filters.
    files_prefix: Qot_
  - name: trading
    description: Trading — unlock, place/modify/cancel orders, positions, funds, order and fill lists.
    files_prefix: Trd_
